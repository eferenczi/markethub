# Rebuild trigger: staging migrations use the PostgreSQL profile.
# Private beta Blueprint. Keeps live email and payment integrations disabled
# while running the same React + Express application against an isolated DB.
services:
  - type: web
    name: markethub-staging
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npm prune --omit=dev
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DB_CLIENT
        value: pg
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: markethub-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://markethub-staging.onrender.com
      - key: CORS_ORIGINS
        value: https://markethub-staging.onrender.com

databases:
  - name: markethub-staging-db
    plan: basic-256mb
